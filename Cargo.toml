[package]
name = "rust-explorer"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.29"
egui_extras = "0.29"
open = "5"
chrono = "0.4"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
dirs = "5"
ureq = "2"
egui-phosphor = "0.7"

[profile.release]
opt-level = 3
strip = true
