[package]
name = "the-real-explorer"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Automate-and-Deploy/the-real-explorer"
description = "File explorer, editor and assistant in one window"

[dependencies]
eframe = "0.29"
egui_extras = { version = "0.29", features = ["syntect"] }
open = "5"
chrono = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
dirs = "5"
ureq = "2"
egui-phosphor = "0.7"
url = "2"
trash = "5"
egui_commonmark = "0.18"

# `drag` is the outgoing OS drag source. Its GTK backend wants a
# `gtk::ApplicationWindow`, which eframe cannot hand it, and it pulls the whole
# GTK3 development stack into a Linux build for a feature that cannot work
# there, so it is per-target.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
drag = "2.1.1"

# `SetFileAttributesW`, to re-hide the notes sidecar after every save. std can
# only toggle the read-only bit, and tmp+rename lands a new file with none of
# the old one's attributes, so this is needed on each write, not once.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[profile.release]
opt-level = 3
strip = true

[package.metadata.packager]
product-name = "The Real Explorer"
identifier = "org.newingham.therealexplorer"
description = "File explorer, editor and assistant in one window"
long-description = "A file explorer with a VS Code style folder tree, a built-in editor with language server support, and an assistant panel that drives Claude Code or any OpenAI-compatible endpoint."
authors = ["Alan Newingham"]
category = "Utility"
icons = ["packaging/icons/icon.png", "packaging/icons/icon.ico"]
out-dir = "dist"
before-packaging-command = "cargo build --release"

[package.metadata.packager.windows]
# Per-user install needs no elevation and matches how the app stores config.
allow-downgrades = true

[package.metadata.packager.nsis]
installer-mode = "currentUser"

[package.metadata.packager.deb]
# Every entry here is dlopen-ed by winit and glutin at runtime rather than
# linked, so the ELF NEEDED list is only libc, libm and libgcc_s and
# dpkg-shlibdeps derives nothing. This list is maintained by hand. Verified
# in a bare ubuntu:24.04 container: without libxkbcommon-x11-0 the app panics
# at startup with "Library libxkbcommon-x11.so could not be loaded", and
# libegl1 with libwayland-egl1 are the Wayland GL path, which is the default
# session on Ubuntu 24.04.
depends = ["libgl1", "libegl1", "libxkbcommon0", "libxkbcommon-x11-0", "libwayland-client0", "libwayland-egl1", "libx11-6", "libxcursor1", "libxrandr2", "libxi6", "libfontconfig1"]

[package.metadata.packager.macos]
minimum-system-version = "11.0"
info-plist-path = "packaging/macos/Info.partial.plist"
